<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaas AI 🧀</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:Inter,Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, #fff6a8 0 12%, transparent 30%),
      radial-gradient(circle at 80% 80%, #ffd75e 0 10%, transparent 28%),
      linear-gradient(135deg,#fff3a6,#ffd35c);
    color:#2b2105;
    overflow:hidden;
  }
  .glow{position:fixed;width:500px;height:500px;border-radius:50%;background:#fff6a8;filter:blur(90px);opacity:.55}
  .app{
    position:relative;width:min(900px,94vw);height:min(760px,92vh);
    background:rgba(255,255,255,.82);backdrop-filter:blur(18px);
    border:2px solid rgba(255,255,255,.8);border-radius:28px;
    box-shadow:0 25px 80px rgba(85,58,0,.22);
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;border-bottom:1px solid #eadb9c;background:rgba(255,252,224,.75)
  }
  .brand{display:flex;align-items:center;gap:13px}
  .logo{
    width:52px;height:52px;border-radius:15px;background:#ffc928;
    display:grid;place-items:center;font-size:30px;
    box-shadow:0 8px 20px rgba(213,148,0,.25)
  }
  h1{margin:0;font-size:23px}
  .sub{font-size:12px;color:#7b6b31}
  .badge{padding:8px 12px;border-radius:999px;background:#fff4bb;color:#765900;font-size:12px;font-weight:700}
  #chat{flex:1;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:15px}
  .msg{max-width:76%;padding:14px 17px;border-radius:18px;line-height:1.45;box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .bot{align-self:flex-start;background:#fff8d8;border:1px solid #f0dda0}
  .user{align-self:flex-end;background:#2d2207;color:white}
  .sender{font-size:11px;font-weight:800;opacity:.65;margin-bottom:5px}
  .cheese{
    font-weight:900;font-size:26px;letter-spacing:1px;
    animation:wobble .7s ease-in-out infinite alternate;
  }
  @keyframes wobble{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
  .suggestions{display:flex;gap:9px;flex-wrap:wrap;padding:0 24px 12px}
  .suggestions button{
    border:1px solid #e7d58f;background:#fffaf0;border-radius:999px;
    padding:9px 13px;cursor:pointer;color:#604900;font-weight:700
  }
  .suggestions button:hover{background:#fff0a9}
  form{display:flex;gap:10px;padding:18px 22px;background:#fffdf1;border-top:1px solid #eadb9c}
  input{
    flex:1;border:2px solid #e2cf7b;background:white;border-radius:16px;
    padding:14px 16px;font-size:15px;outline:none
  }
  input:focus{border-color:#c99e12;box-shadow:0 0 0 4px #ffeaa044}
  .send{
    border:0;border-radius:16px;padding:0 20px;background:#f5b900;color:#2b2105;
    font-weight:900;cursor:pointer;font-size:15px
  }
  .send:hover{background:#ffca20;transform:translateY(-1px)}
  .tiny{padding:0 24px 14px;color:#8c7b40;font-size:11px;text-align:center}
  @media(max-width:600px){
    .app{height:94vh;border-radius:22px}
    .msg{max-width:88%}.badge{display:none}
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🧀</div>
      <div>
        <h1>Kaas AI</h1>
        <div class="sub">De meest kaasachtige AI ooit.</div>
      </div>
    </div>
    <div class="badge">100% KAAS</div>
  </header>
  <main id="chat">
    <div class="msg bot">
      <div class="sender">KAAS AI 🧀</div>
      <div class="cheese">KAAS.</div>
      <div style="margin-top:6px">Ik ben Kaas AI. Mijn antwoord op bijna alles? 🧀</div>
    </div>
  </main>
  <div class="suggestions">
    <button onclick="ask('Wat is je favoriete eten?')">Favoriete eten?</button>
    <button onclick="ask('Wie ben jij?')">Wie ben jij?</button>
    <button onclick="ask('Wat is 2 + 2?')">2 + 2?</button>
    <button onclick="ask('Zeg iets')">Zeg iets</button>
  </div>
  <form onsubmit="sendMessage(event)">
    <input id="input" autocomplete="off" placeholder="Typ iets tegen Kaas AI...">
    <button class="send" type="submit">Stuur 🧀</button>
  </form>
  <div class="tiny">Waarschuwing: deze AI heeft een extreem grote kaasverslaving.</div>
</div>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
function addMessage(text, type){
  const box = document.createElement("div");
  box.className = "msg " + type;
  if(type === "bot"){
    box.innerHTML = '<div class="sender">KAAS AI 🧀</div><div class="cheese">' + text + '</div>';
  } else {
    box.innerHTML = '<div class="sender">JIJ</div>' + escapeHtml(text);
  }
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}
function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function sendMessage(e){
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  ask(text);
}
function ask(text){
  addMessage(text, "user");
  input.value = "";
  setTimeout(() => {
    const answers = ["KAAS.","KAAS KAAS KAAS.","🧀 KAAS.","ABSOLUUT KAAS.","Mijn berekening zegt: KAAS.","Sorry, ik spreek alleen kaas. 🧀","Interessant... maar KAAS."];
    addMessage(answers[Math.floor(Math.random()*answers.length)], "bot");
  }, 450);
}
</script>
</body>
</html>
